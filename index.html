<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Para ti 🌷</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div id="lock">
  <h1>🔒 Solo para ti</h1>
  <p id="q">Escribe la fecha que nacio la mujer mas linda</p>
  <div class="dots" id="dots"></div>
  <div class="pad" id="pad"></div>
</div>

<div id="scene">
  <div id="rain"></div>
  <button id="addph" title="Vista previa con tus fotos">＋ fotos</button>
  <input type="file" id="file" accept="image/*" multiple hidden>
  <div id="hint">Toca una flor 🌷</div>
  <div id="title" class="tittle">
    FELIZ CUMPLEAÑOS 💐
  </div>
  <svg id="bouquet" viewBox="0 0 300 400" aria-label="Ramo de lirios y tulipanes">
    <defs>
      <g id="lily">
        <g fill="#fb7185" stroke="#be123c" stroke-width=".8">
          <path id="lp" d="M0 0C-13 -18 -10 -46 0 -62C10 -46 13 -18 0 0Z"/>
          <use href="#lp" transform="rotate(-80)"/><use href="#lp" transform="rotate(-48)"/>
          <use href="#lp" transform="rotate(-16)"/><use href="#lp" transform="rotate(16)"/>
          <use href="#lp" transform="rotate(48)"/><use href="#lp" transform="rotate(80)"/>
        </g>
        <path d="M0 0L-3 -30M0 0L3 -32M0 0L9 -26" stroke="#fde047" stroke-width="2" stroke-linecap="round"/>
        <circle cx="-3" cy="-31" r="2.5" fill="#f59e0b"/><circle cx="3" cy="-33" r="2.5" fill="#f59e0b"/><circle cx="9" cy="-27" r="2.5" fill="#f59e0b"/>
      </g>
      <g id="tulip">
        <path d="M-22 -4C-27 -34 -15 -54 -10 -64L0 -46L10 -64C15 -54 27 -34 22 -4C14 10 -14 10 -22 -4Z" fill="#f472b6" stroke="#be185d" stroke-width=".8"/>
        <path d="M-9 -2C-14 -30 -4 -48 0 -58C4 -48 14 -30 9 -2C4 6 -4 6 -9 -2Z" fill="#fbcfe8" opacity=".75"/>
      </g>
    </defs>
    <g class="sway">
      <!-- tallos -->
      <g id="stems">
        <path class="stem" pathLength="1" style="--d:0s"   d="M150 392C150 300 150 200 150 112"/>
        <path class="stem" pathLength="1" style="--d:.3s"  d="M150 392C140 320 110 230 92 170"/>
        <path class="stem" pathLength="1" style="--d:.5s"  d="M150 392C165 320 195 230 208 170"/>
        <path class="stem" pathLength="1" style="--d:.7s"  d="M150 392C120 340 80 290 58 250"/>
        <path class="stem" pathLength="1" style="--d:.9s"  d="M150 392C180 340 220 290 242 250"/>
        <path class="stem" pathLength="1" style="--d:1.1s" d="M150 392C150 340 150 270 150 232"/>
      </g>
      <!-- hojas -->
      <path class="leaf" style="--d:.8s" d="M146 330C110 320 95 290 100 270C130 275 145 300 146 330Z"/>
      <path class="leaf" style="--d:1.2s;transform-origin:100% 100%" d="M154 330C190 320 205 290 200 270C170 275 155 300 154 330Z"/>
      <path class="leaf" style="--d:1.4s" d="M148 372C120 372 100 355 96 340C125 340 144 352 148 372Z"/>
      <path class="leaf" style="--d:1.6s;transform-origin:100% 100%" d="M152 372C180 372 200 355 204 340C175 340 156 352 152 372Z"/>
      <!-- flores -->
      <g class="fl" data-i="0" transform="translate(150 112)"><g class="bloom" style="--d:0s"><use href="#lily"/></g></g>
      <g class="fl" data-i="1" transform="translate(92 170)"><g class="bloom" style="--d:.3s"><use href="#tulip"/></g></g>
      <g class="fl" data-i="2" transform="translate(208 170)"><g class="bloom" style="--d:.5s"><use href="#lily"/></g></g>
      <g class="fl" data-i="3" transform="translate(58 250)"><g class="bloom" style="--d:.7s"><use href="#tulip"/></g></g>
      <g class="fl" data-i="4" transform="translate(242 250)"><g class="bloom" style="--d:.9s"><use href="#lily"/></g></g>
      <g class="fl" data-i="5" transform="translate(150 232)"><g class="bloom" style="--d:1.1s"><use href="#tulip"/></g></g>
    </g>
  </svg>
</div>

<div id="modal"><div class="letter"><h2 id="lt"></h2><p id="lx"></p><button id="close">Cerrar 💌</button></div></div>

<script src="script.js"></script>
</body>
</html>
